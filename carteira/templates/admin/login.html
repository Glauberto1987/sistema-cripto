{% extends "admin/login.html" %}
{% load static %}

<!-- Substitui o texto original do Django -->
{% block branding %}
    <h1 id="site-name" style="color: white; font-weight: bold; padding-left: 10px;">
        Acesso ao Sistema
    </h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    body.login {
        background-image: url('{% static "logo.png" %}');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }
    
    /* Efeito vidro (glassmorphism) da caixa */
    .login #container {
        background-color: rgba(10, 10, 10, 0.15) !important;
        backdrop-filter: blur(4px);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    #header {
        background-color: transparent !important;
    }
    
    .login #content, 
    .login #content-main {
        background: transparent !important;
    }
    
    /* Textos brancos para contraste */
    .login .form-row label {
        color: #ffffff !important;
        font-weight: 500;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* Efeito neon do botão de voltar */
    .btn-voltar:hover {
        background-color: rgba(0, 184, 255, 0.2) !important;
        box-shadow: 0 0 12px rgba(0, 184, 255, 0.6);
        border-color: #00b8ff !important;
        color: #ffffff !important;
    }
</style>
{% endblock %}

<!-- Bloco de conteúdo com apenas UM botão -->
{% block content %}
    {{ block.super }}
    
    <div style="margin-top: 25px; text-align: center;">
        <a href="/documentario/" class="btn-voltar" style="color: #00b8ff; text-decoration: none; font-size: 14px; font-weight: bold; padding: 10px 20px; border: 1px solid rgba(0, 184, 255, 0.4); border-radius: 8px; background: rgba(0, 0, 0, 0.4); transition: all 0.3s; display: inline-block; letter-spacing: 0.5px;">
            &larr; Voltar para o Painel Docs
        </a>
    </div>
{% endblock %}
