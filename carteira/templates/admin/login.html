{% extends "admin/login.html" %}
{% load static %}

<!-- 1. Substitui o texto "Django administration" -->
{% block branding %}
    <h1 id="site-name" style="color: white; font-weight: bold; padding-left: 10px;">
        <!-- Você pode apagar o texto abaixo se quiser que não apareça NADA -->
        Acesso ao Sistema
    </h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    body.login {
        background-image: url('{% static "logo.png" %}');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }
    
    /* 2. Deixa a caixa principal muito mais transparente (efeito vidro) */
    .login #container {
        background-color: rgba(10, 10, 10, 0.15) !important; /* Apenas 15% de opacidade escurecida */
        backdrop-filter: blur(4px); /* Desfoque suave no fundo para leitura */
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* Remove o fundo escuro sólido do cabeçalho */
    #header {
        background-color: transparent !important;
    }
    
    /* Remove os fundos brancos/cinzas padrões do Django dentro da caixa */
    .login #content, 
    .login #content-main {
        background: transparent !important;
    }
    
    /* Força os textos "Username" e "Password" a ficarem brancos */
    .login .form-row label {
        color: #ffffff !important;
        font-weight: 500;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8); /* Sombra para não sumir no fundo claro */
    }
</style>
{% endblock %}
